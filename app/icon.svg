<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d1a" />
      <stop offset="100%" stop-color="#121110" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ea580c" stroke-opacity="0.35" stroke-width="2" />

  <!-- Stylized Monogram NA -->
  <g transform="translate(11, 15)">
    <!-- Letter N -->
    <path d="M4 34 V4 L18 34 V4" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter A -->
    <path d="M24 34 L33 4 L42 34" fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M27.5 23 H38.5" fill="none" stroke="url(#orangeGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Neural Pulse Dot -->
  <circle cx="49" cy="15" r="3.5" fill="#f97316" filter="url(#glow)" />
</svg>
